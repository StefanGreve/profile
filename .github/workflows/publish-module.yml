name: Publish Module

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version Number"
        required: true

permissions:
  contents: read

env:
  API_KEY: ${{ secrets.PSGALLERY_API_TOKEN }}
  RELEASE_VERSION: ${{ github.event.inputs.version }}

jobs:
  deploy:
    name: Deployment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Publish Module
        shell: pwsh
        run: |
          ./scripts/publish.ps1 `
            -Version $env:RELEASE_VERSION `
            -ApiKey $env:API_KEY `
            -Confirm:$false
